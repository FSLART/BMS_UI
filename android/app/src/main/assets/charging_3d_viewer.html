<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LART 3D Charging Assembly</title>
  <script src="js/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #05080D;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      position: relative;
    }

    .viewer-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    model-viewer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      --poster-color: transparent;
      outline: none;
      transition: opacity 0.3s ease-out;
    }

    #viewerLid {
      pointer-events: none;
      will-change: transform;
    }

    #viewerClosed {
      opacity: 0;
      pointer-events: none;
    }

    #animCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Reset view button */
    .btn-3d-reset {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 25;
      background: rgba(14, 20, 29, 0.88);
      border: 1px solid rgba(255, 214, 10, 0.5);
      border-radius: 8px;
      color: #FFD60A;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.7);
    }

    /* Loading Spinner */
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #05080D;
      color: #FFD60A;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      gap: 12px;
      z-index: 50;
      transition: opacity 0.3s ease-out;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 214, 10, 0.2);
      border-top-color: #FFD60A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loader" class="loading-overlay">
    <div class="spinner"></div>
    <span>A CARREGAR MODELOS 3D DO ACUMULADOR...</span>
  </div>

  <!-- 3D Model Viewers Layer (Open Chassis + Descending Lid + Closed Assembly) -->
  <div class="viewer-container">
    <!-- 1. Open Battery 3D Assembly (No Lid, 6 Segments & Busbars Exposed) -->
    <model-viewer id="viewerOpen"
      src="models/tek26e_open_light.glb"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      rotation-per-second="12deg"
      camera-orbit="220deg 68deg 95%"
      field-of-view="28deg"
      shadow-intensity="1.2"
      shadow-softness="0.8"
      exposure="0.85"
      interaction-prompt="none"
      animation-name="fans">
    </model-viewer>

    <!-- 2. Descending Lid 3D Assembly (Lid-1 + Cover Tabs + M6 Screws) -->
    <model-viewer id="viewerLid"
      src="models/tek26e_lid.glb"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      rotation-per-second="12deg"
      camera-orbit="220deg 68deg 95%"
      field-of-view="28deg"
      shadow-intensity="0"
      exposure="0.85"
      interaction-prompt="none"
      style="transform: translateY(-140px);">
    </model-viewer>

    <!-- 3. Closed Battery 3D Assembly (Final Sealed Assembly) -->
    <model-viewer id="viewerClosed"
      src="models/tek26e_closed.glb"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      rotation-per-second="12deg"
      camera-orbit="220deg 68deg 95%"
      field-of-view="28deg"
      shadow-intensity="1.2"
      shadow-softness="0.8"
      exposure="0.85"
      interaction-prompt="none"
      animation-name="fans">
    </model-viewer>
  </div>

  <canvas id="animCanvas"></canvas>

  <!-- 3D View Reset Button -->
  <button class="btn-3d-reset" onclick="reset3DCamera()">
    <span>🎯</span> Centrar 3D
  </button>

  <script>
    const viewerOpen = document.getElementById('viewerOpen');
    const viewerLid = document.getElementById('viewerLid');
    const viewerClosed = document.getElementById('viewerClosed');
    const canvas = document.getElementById('animCanvas');
    const ctx = canvas.getContext('2d');
    const loader = document.getElementById('loader');

    let isLoaded = false;
    let animStartTime = 0;
    const ANIM_DURATION = 3500; // ms
    let animRAF = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function enhanceMaterials(mv) {
      if (!mv.model || !mv.model.materials) return;
      for (const mat of mv.model.materials) {
        const pbr = mat.pbrMetallicRoughness;
        if (!pbr) continue;
        if (pbr.roughnessFactor < 0.65) pbr.setRoughnessFactor(0.65);
      }
    }

    let loadedCount = 0;
    function checkLoaded() {
      loadedCount++;
      if (loadedCount >= 2) {
        enhanceMaterials(viewerOpen);
        enhanceMaterials(viewerLid);
        enhanceMaterials(viewerClosed);
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.display = 'none'; }, 300);
        isLoaded = true;
        startAssemblySequence();
      }
    }

    viewerOpen.addEventListener('load', checkLoaded);
    viewerLid.addEventListener('load', checkLoaded);
    viewerClosed.addEventListener('load', checkLoaded);

    setTimeout(() => {
      if (!isLoaded) {
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.display = 'none'; }, 300);
        isLoaded = true;
        startAssemblySequence();
      }
    }, 2200);

    // Sync camera orbits between all 3 viewers
    function syncCameras(source) {
      const orbit = source.cameraOrbit;
      const fov = source.fieldOfView;

      if (source !== viewerOpen && viewerOpen) {
        viewerOpen.cameraOrbit = orbit;
        viewerOpen.fieldOfView = fov;
      }
      if (source !== viewerLid && viewerLid) {
        viewerLid.cameraOrbit = orbit;
        viewerLid.fieldOfView = fov;
      }
      if (source !== viewerClosed && viewerClosed) {
        viewerClosed.cameraOrbit = orbit;
        viewerClosed.fieldOfView = fov;
      }
    }

    viewerOpen.addEventListener('camera-change', () => syncCameras(viewerOpen));
    viewerClosed.addEventListener('camera-change', () => syncCameras(viewerClosed));

    function reset3DCamera() {
      const def = '220deg 68deg 95%';
      viewerOpen.cameraOrbit = def;
      viewerLid.cameraOrbit = def;
      viewerClosed.cameraOrbit = def;
    }

    function startAssemblySequence() {
      if (animRAF) cancelAnimationFrame(animRAF);
      animStartTime = performance.now();
      runAnimLoop();
    }

    function runAnimLoop() {
      const now = performance.now();
      const elapsed = now - animStartTime;
      const progress = Math.min(1.0, elapsed / ANIM_DURATION);

      renderFrame(progress, now);

      animRAF = requestAnimationFrame(runAnimLoop);
    }

    function renderFrame(progress, now) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);

      // Phase 1 (0.0 to 0.20): Open battery resting, lid hovering above at -140px
      // Phase 2 (0.20 to 0.72): Lid smoothly descends from -140px down to 0px
      // Phase 3 (0.72 to 0.85): Lid is seated at 0px; subtle seal
      // Phase 4 (0.85 to 1.00): Battery fully closed & sealed (fans rotating)

      const startY = -140; // px above

      if (progress < 0.20) {
        // Hovering above
        viewerOpen.style.opacity = '1';
        viewerLid.style.opacity = '1';
        viewerLid.style.transform = `translateY(${startY}px)`;
        viewerClosed.style.opacity = '0';
        viewerClosed.style.pointerEvents = 'none';
        viewerOpen.style.pointerEvents = 'auto';
      } else if (progress < 0.72) {
        // Physical descent with smooth deceleration (easeOutCubic)
        const p = (progress - 0.20) / 0.52;
        const ease = 1 - Math.pow(1 - p, 3);
        const yOffset = (1 - ease) * startY;

        viewerOpen.style.opacity = '1';
        viewerLid.style.opacity = '1';
        viewerLid.style.transform = `translateY(${yOffset.toFixed(2)}px)`;
        viewerClosed.style.opacity = '0';
        viewerClosed.style.pointerEvents = 'none';
        viewerOpen.style.pointerEvents = 'auto';
      } else if (progress < 0.85) {
        // Lid has landed flush onto the battery
        viewerOpen.style.opacity = '1';
        viewerLid.style.opacity = '1';
        viewerLid.style.transform = 'translateY(0px)';

        // Gentle crossfade to the final sealed assembly
        const pSeal = (progress - 0.72) / 0.13;
        viewerClosed.style.opacity = (pSeal * pSeal).toString();
      } else {
        // Fully assembled and sealed
        viewerOpen.style.opacity = '0';
        viewerLid.style.opacity = '0';
        viewerLid.style.transform = 'translateY(0px)';
        viewerClosed.style.opacity = '1';
        viewerClosed.style.pointerEvents = 'auto';
        viewerOpen.style.pointerEvents = 'none';
      }
    }

    // Public API for Android / Web callers
    window.restartAnimation = function() {
      viewerClosed.style.pointerEvents = 'none';
      viewerOpen.style.pointerEvents = 'auto';
      startAssemblySequence();
    };

    window.updateTelemetry = function(data) {};
  </script>
</body>
</html>
